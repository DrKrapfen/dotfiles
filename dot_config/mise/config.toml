# Reproducibility manifest — chezmoi + this file = fresh-machine rebuild.
# `chezmoi apply` re-runs `mise install` whenever this file changes.
[tools]
node = "lts"
go = "latest"
opentofu = "latest"
neovim = "latest"          # terminal fallback editor (EDITOR when `code` isn't on PATH)
lazygit = "latest"
lazydocker = "latest"
zellij = "latest"
github-cli = "latest"
chezmoi = "latest"

# Python / JS package managers + shell history
uv = "latest"
pnpm = "latest"
atuin = "latest"

# Modern CLI
eza = "latest"
bat = "latest"
fd = "latest"
ripgrep = "latest"
zoxide = "latest"
fzf = "latest"
delta = "latest"
bottom = "latest"
btop = "latest"
jq = "latest"

# Extras
yazi = "latest"
glow = "latest"
gping = "latest"
